language: node_js
node_js:
  - "18"
  - "16"
  - "14"
  - "12"
  - "10"
  - "8"
before_install:
  # package-lock.json resolves the transitive dev dep v8-argv as
  # git+ssh://git@github.com/jkroso/v8-argv.git; npm 6 (Node <= 14) runs
  # `git ls-remote ssh://...` and Travis has no GitHub SSH key, so npm ci dies
  # with "Permission denied (publickey)". Fetch it over anonymous https instead.
  - git config --global url."https://github.com/".insteadOf ssh://git@github.com/
jobs:
  include:
    # engines floor is node >=0.10. rollup/typescript/ts-node need a newer Node,
    # and test/merge.js / test/custom-is-mergeable-object.js (arrow functions,
    # template literals) and test/prototype-poisoning.js (computed Symbol key)
    # use ES6 syntax, so this leg installs + builds dist/cjs.js under Node 12,
    # then switches to Node 0.10 and runs tape on the ES5-parsable test files.
    - name: "Node 0.10 (ES5 tests against built dist)"
      node_js: "12"
      script:
        - npm run build
        - nvm install 0.10
        - node --version
        - node node_modules/tape/bin/tape test/custom-array-merge.js test/merge-all.js
